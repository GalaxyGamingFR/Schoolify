services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolify
      POSTGRES_PASSWORD: schoolify_dev
      POSTGRES_DB: schoolify
    ports:
      - "5432:5432"
    volumes:
      - schoolify_db_data:/var/lib/postgresql/data

volumes:
  schoolify_db_data:
